<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Waterkwaliteitsboei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!-- navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="https://github.com/TheEpicBlock/BraadworstSpringCalculatorEdition/blob/4585f7bd4e7602af4da7945c123764a2ab2c69d7/src/gfx/source/braadworst0.png?raw=true"
                 alt="logo" width="30" height="30" class="d-inline-block align-text-top">
            Waterkwaliteitsboei
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="test.html">Promotiemateriaal</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- advice cards -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm" id="zwemadviesCard">
                <div class="card-body text-center">
                    <h2 class="card-title">Zwemadvies</h2>
                    <div class="py-3">
                        <span class="badge p-3 fs-4" id="zwemadviesBadge"></span>
                    </div>
                    <p class="card-text text-muted">Risico: <span id="zwemrisico"></span>%</p>
                </div>
                <div class="card-footer bg-transparent" id="zwemadviesFooter">
                    <small id="zwemadviesVoorspelling"></small>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm" id="visadviesCard">
                <div class="card-body text-center">
                    <h2 class="card-title">Visadvies</h2>
                    <div class="py-3">
                        <span class="badge p-3 fs-4" id="visadviesBadge"></span>
                    </div>
                    <p class="card-text text-muted">Risico: <span id="visrisico"></span>%</p>
                </div>
                <div class="card-footer bg-transparent" id="visadviesFooter">
                    <small id="visadviesVoorspelling"></small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- data cards -->
<div class="container">
    <div class="row text-center mb-4">
        <div class="col-md-4">
            <div class="card p-3 sensor-card" data-sensor="temperatuur">
                <h5>Luchttemperatuur</h5>
                <p class="status-value" id="temperatuur">°C</p>
                <small class="text-primary">● BME280</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 sensor-card" data-sensor="luchtvochtigheid">
                <h5>Luchtvochtigheid</h5>
                <p class="status-value" id="luchtvochtigheid">%</p>
                <small class="text-primary">● BME280</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 sensor-card" data-sensor="luchtdruk">
                <h5>Luchtdruk</h5>
                <p class="status-value" id="luchtdruk">hPa</p>
                <small class="text-primary">● BME280</small>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row text-center mb-4">
        <div class="col-md-6">
            <div class="card p-3 sensor-card" data-sensor="watertemperatuur">
                <h5>Watertemperatuur</h5>
                <p class="status-value" id="watertemperatuur">°C</p>
                <small class="text-primary">●</small>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 sensor-card" data-sensor="troebelheid">
                <h5>Troebelheid</h5>
                <p class="status-value" id="troebelheid">NTU</p>
                <small class="text-primary">●</small>
            </div>
        </div>
    </div>
</div>

<!-- graph -->
<div class="container">
    <div class="col-12">
        <div class="card p-4">
            <h5 id="chartTitle">Afgelopen week</h5>
            <canvas id="sensorChart"></canvas>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
